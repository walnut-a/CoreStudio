name: 部署 CoreStudio 官网

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署官网
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 校验官网契约
        run: node --test website/update-manifest-contract.test.mjs website/canvas-engine.test.mjs website/integrations-contract.test.mjs

      - name: 准备官网文件
        run: |
          mkdir -p "$RUNNER_TEMP/corestudio-site"
          cp -R website/. "$RUNNER_TEMP/corestudio-site/"
          mkdir -p "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Excalifont"
          cp excalidraw/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Excalifont/"

      - name: 上传官网文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/corestudio-site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
