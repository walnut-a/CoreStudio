<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CoreStudio 是基于 Excalidraw 的本地优先图片生成画布，支持自由选择模型并与 Codex 等 Agent 协作。"
    />
    <meta name="theme-color" content="#f8f8f7" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="CoreStudio · 本地优先的图片生成画布" />
    <meta
      property="og:description"
      content="把画布、参考素材、生成结果和 Agent 协作放进同一个本地项目。"
    />
    <meta property="og:url" content="https://getcorestudio.com/zh/" />
    <meta
      property="og:image"
      content="https://getcorestudio.com/assets/corestudio-social-card.jpeg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CoreStudio 画布中的工业设计概念图" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>CoreStudio · 本地优先的图片生成画布</title>
    <link
      rel="icon"
      href="../assets/corestudio-favicon-32.png"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="../assets/corestudio-apple-touch-icon.png"
    />
    <link rel="canonical" href="https://getcorestudio.com/zh/" />
    <link
      rel="alternate"
      hreflang="zh-CN"
      href="https://getcorestudio.com/zh/"
    />
    <link rel="alternate" hreflang="en" href="https://getcorestudio.com/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://getcorestudio.com/"
    />
    <link rel="stylesheet" href="../styles.css?v=20260830-6" />
    <script type="module" src="../main.js?v=20260830-6"></script>
  </head>
  <body>
    <!--
    THESIS: CoreStudio 官网是一张可操作的工业设计编辑桌，不把产品降格为传统营销页或编辑器截图。
    OWN-WORLD: 冷白点阵画布、近黑编辑排版、暖白与铝灰产品图像；紫色只属于真实 CoreStudio 交互状态。
    STORY: 访问者从真实参考素材读到大幅生成结果，再从细节带看见结果如何留在同一个本地画布中继续整理，最后下载 macOS 客户端。
    FIRST VIEWPORT: 左侧只保留近黑标题场和紧凑参考带，右侧由大幅裁切结果占据；细节带与次要标注仅在生成后出现。
    FORM: 用户委托选择的工业设计编辑部宽幅编辑桌；批准稿 industrial-editorial-wide.png；方向种子 5cad0bdf 仅用于复现，用户明确固定的方向优先于其分配挑战项。
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#main">跳到画布演示</a>

    <div class="canvas-app" data-canvas-app>
      <header class="canvas-header">
        <a class="brand" href="#canvas-home" aria-label="CoreStudio 首页">
          <img
            src="../assets/corestudio-icon-256.png"
            srcset="
              ../assets/corestudio-icon-64.webp   64w,
              ../assets/corestudio-icon-256.webp 256w
            "
            sizes="34px"
            width="34"
            height="34"
            alt=""
          />
          <span>CoreStudio</span>
        </a>

        <div class="header-actions">
          <a
            class="header-link header-github"
            href="https://github.com/walnut-a/CoreStudio"
            target="_blank"
            rel="noreferrer"
            >GitHub</a
          >
          <a
            class="header-link language-link"
            href="../index.html"
            lang="en"
            hreflang="en"
            >EN</a
          >
          <a
            class="download-button"
            href="https://github.com/walnut-a/CoreStudio/releases/latest"
            target="_blank"
            rel="noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
              <path d="m7 11 5 5 5-5" />
              <path d="M12 4v12" />
            </svg>
            <span>下载 macOS 版</span>
          </a>
        </div>
      </header>

      <main class="canvas-main" id="main" tabindex="-1">
        <div
          class="canvas-viewport"
          data-canvas-viewport
          aria-label="CoreStudio 产品交互演示"
        >
          <div class="canvas-plane" data-canvas-plane>
            <div class="project-tab" aria-hidden="true">
              <span class="project-home">
                <svg viewBox="0 0 24 24">
                  <path d="m5.25 10.25 6.75-5.5 6.75 5.5" />
                  <path d="M7.25 9.25v9h9.5v-9" />
                  <path d="M10 18.25v-5.5h4v5.5" />
                </svg>
              </span>
              <span>Dieter Rams 参考</span>
              <span class="project-close"
                ><svg viewBox="0 0 24 24">
                  <path d="m7.5 7.5 9 9" />
                  <path d="m16.5 7.5-9 9" /></svg
              ></span>
            </div>

            <section class="scene-title" id="canvas-home" data-scene-object>
              <div class="scene-heading">
                <div class="canvas-selection-overlay" aria-hidden="true">
                  <span class="canvas-selection-border"></span>
                  <span class="canvas-transform-handle canvas-handle-nw"></span>
                  <span class="canvas-transform-handle canvas-handle-ne"></span>
                  <span class="canvas-transform-handle canvas-handle-se"></span>
                  <span class="canvas-transform-handle canvas-handle-sw"></span>
                  <span
                    class="canvas-transform-handle canvas-handle-rotation"
                  ></span>
                </div>
                <h1>本地优先的<br />图片生成画布</h1>
              </div>
              <p>
                基于 Excalidraw。项目留在本地，模型自由选择，Agent 可直接写回。
              </p>
            </section>

            <div
              class="canvas-annotation canvas-annotation-local"
              data-scene-object
            >
              <div class="canvas-selection-overlay" aria-hidden="true">
                <span class="canvas-selection-border"></span>
                <span class="canvas-transform-handle canvas-handle-nw"></span>
                <span class="canvas-transform-handle canvas-handle-ne"></span>
                <span class="canvas-transform-handle canvas-handle-se"></span>
                <span class="canvas-transform-handle canvas-handle-sw"></span>
                <span
                  class="canvas-transform-handle canvas-handle-rotation"
                ></span>
              </div>
              <span class="canvas-annotation-title">本地项目</span>
              <span class="canvas-annotation-detail">参考与结果都留在本机</span>
            </div>

            <figure
              class="reference-board is-multi-selected"
              data-scene-object
            >
              <div class="reference-selection-target">
                <div
                  class="reference-images"
                  aria-label="四张 Dieter Rams 作品参考素材"
                >
                  <img
                    class="reference-image reference-image-a"
                    src="../assets/dieter-rams-tp1.webp"
                    alt="Dieter Rams 设计的 Braun TP1 便携收音机与唱机"
                  />
                  <img
                    class="reference-image reference-image-b"
                    src="../assets/dieter-rams-sk4-v2.webp"
                    alt="Dieter Rams 与 Hans Gugelot 设计的 Braun SK 4 收音唱机"
                  />
                  <img
                    class="reference-image reference-image-c"
                    src="../assets/dieter-rams-t4.webp"
                    alt="Dieter Rams 设计的 Braun T4 晶体管收音机"
                  />
                  <img
                    class="reference-image reference-image-d"
                    src="../assets/dieter-rams-et66-v2.webp"
                    alt="Dieter Rams 与 Dietrich Lubs 设计的 Braun ET66 计算器"
                  />
                </div>
                <div class="canvas-selection-overlay" aria-hidden="true">
                  <span class="canvas-selection-border"></span>
                  <span class="canvas-transform-handle canvas-handle-nw"></span>
                  <span class="canvas-transform-handle canvas-handle-ne"></span>
                  <span class="canvas-transform-handle canvas-handle-se"></span>
                  <span class="canvas-transform-handle canvas-handle-sw"></span>
                  <span
                    class="canvas-transform-handle canvas-handle-rotation"
                  ></span>
                </div>
              </div>
              <figcaption>4 张参考 · 保存在本地</figcaption>
            </figure>

            <svg
              class="canvas-connectors"
              viewBox="0 0 1680 960"
              aria-hidden="true"
            >
              <svg
                class="excalidraw-arrow-native"
                data-excalidraw-arrow
                data-export-source="excalidraw"
                x="676"
                y="312"
                width="144"
                height="56"
                viewBox="0 0 144 56"
              >
                <!-- svg-source:excalidraw -->
                <metadata></metadata>
                <g
                  stroke-linecap="round"
                  data-id="website-reference-flow-arrow"
                >
                  <path
                    data-arrow-shaft-extension
                    d="M0 50 C30 49, 66 52, 108 40 M0 50 C32 51, 69 49, 108 40"
                    stroke="#1b1b1f"
                    stroke-width="2"
                    fill="none"
                  />
                  <g
                    transform="translate(108 40) rotate(0 18 -13.999633182691296)"
                  >
                    <path
                      d="M0 0 C4 0.02, 7.06 -0.29, 18 -2 M0 0 C4.99 -0.86, 9.7 -0.86, 18 -2 M18 -2 C23.01 -8.07, 26.67 -14.85, 36 -28 M18 -2 C24.98 -11.33, 31.18 -21.2, 36 -28"
                      stroke="#1b1b1f"
                      stroke-width="2"
                      fill="none"
                    />
                  </g>
                  <g
                    transform="translate(108 40) rotate(0 18 -13.999633182691296)"
                  >
                    <path
                      d="M32.06 -12.69 C33.25 -15.37, 33.57 -18.36, 36 -28 M32.06 -12.69 C33.28 -17.15, 34.18 -20.84, 36 -28"
                      stroke="#1b1b1f"
                      stroke-width="2"
                      fill="none"
                    />
                  </g>
                  <g
                    transform="translate(108 40) rotate(0 18 -13.999633182691296)"
                  >
                    <path
                      d="M23.14 -18.8 C26.09 -20.27, 28.2 -22.03, 36 -28 M23.14 -18.8 C26.76 -21.59, 30.09 -23.61, 36 -28"
                      stroke="#1b1b1f"
                      stroke-width="2"
                      fill="none"
                    />
                  </g>
                </g>
              </svg>
            </svg>

            <div
              class="canvas-annotation canvas-annotation-model"
              data-scene-object
            >
              <div class="canvas-selection-overlay" aria-hidden="true">
                <span class="canvas-selection-border"></span>
                <span class="canvas-transform-handle canvas-handle-nw"></span>
                <span class="canvas-transform-handle canvas-handle-ne"></span>
                <span class="canvas-transform-handle canvas-handle-se"></span>
                <span class="canvas-transform-handle canvas-handle-sw"></span>
                <span
                  class="canvas-transform-handle canvas-handle-rotation"
                ></span>
              </div>
              <span class="canvas-annotation-title">模型自由</span>
              <span class="canvas-annotation-detail"
                >按质量、速度或预算选择</span
              >
            </div>

            <figure class="generation-result" data-scene-object>
              <div class="result-frame">
                <div class="result-placeholder" aria-hidden="true">
                  <span>正在生成</span>
                </div>
                <img
                  class="result-image"
                  src="../assets/corestudio-canvas-result-rams-v2.webp"
                  alt="CoreStudio 演示中生成的原创模块化桌面音响控制器"
                  width="1536"
                  height="1024"
                />
                <div class="canvas-selection-overlay" aria-hidden="true">
                  <span class="canvas-selection-border"></span>
                  <span class="canvas-transform-handle canvas-handle-nw"></span>
                  <span class="canvas-transform-handle canvas-handle-ne"></span>
                  <span class="canvas-transform-handle canvas-handle-se"></span>
                  <span class="canvas-transform-handle canvas-handle-sw"></span>
                  <span
                    class="canvas-transform-handle canvas-handle-rotation"
                  ></span>
                </div>
              </div>
              <figcaption>示意生成演示</figcaption>
            </figure>

            <div
              class="canvas-annotation canvas-annotation-agent"
              data-scene-object
            >
              <div class="canvas-selection-overlay" aria-hidden="true">
                <span class="canvas-selection-border"></span>
                <span class="canvas-transform-handle canvas-handle-nw"></span>
                <span class="canvas-transform-handle canvas-handle-ne"></span>
                <span class="canvas-transform-handle canvas-handle-se"></span>
                <span class="canvas-transform-handle canvas-handle-sw"></span>
                <span
                  class="canvas-transform-handle canvas-handle-rotation"
                ></span>
              </div>
              <span class="canvas-annotation-title">Agent 写回</span>
              <span class="canvas-annotation-detail">共用当前画布与上下文</span>
            </div>

            <div class="agent-cursor" aria-hidden="true">
              <svg viewBox="0 0 11 14">
                <path d="M0 0v14l4-5 7-1Z" />
              </svg>
              <span>Codex</span>
            </div>
          </div>
        </div>

        <div class="canvas-dock canvas-dock-left">
          <div
            class="zoom-control is-expanded"
            data-zoom-control
            aria-label="画布缩放控件"
          >
            <button type="button" data-zoom-out aria-label="缩小画布">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 10h10" />
              </svg>
            </button>
            <button
              class="zoom-value"
              type="button"
              data-zoom-toggle
              aria-label="收起缩放控件，当前缩放 90%"
              aria-expanded="true"
            >
              <span data-zoom-label>90%</span>
            </button>
            <button type="button" data-zoom-in aria-label="放大画布">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M10 4.167v11.666M4.167 10h11.666" />
              </svg>
            </button>
          </div>
        </div>

        <form
          class="generation-composer"
          data-generation-form
          data-status-references-selected="已选择 4 张参考图"
          data-status-generating="正在画布中生成…"
          data-status-generated="图片已生成"
        >
          <label class="sr-only" for="generation-prompt-zh"
            >描述想生成的图片</label
          >
          <input
            id="generation-prompt-zh"
            data-prompt-input
            value="一台暖白机身、黑色网格与橙色状态点的模块化桌面音响控制器"
            autocomplete="off"
          />
          <button class="generate-button" type="submit" data-generate-button>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 11.75 18.25 5.5a.7.7 0 0 1 .95.82l-3.85 12.9a.7.7 0 0 1-1.26.18l-3.05-4.65-4.98-1.72a.7.7 0 0 1-.06-1.28Z"
              />
              <path d="m11.05 14.7 3.7-3.7" />
            </svg>
            <span class="sr-only">生成</span>
          </button>
          <p
            class="sr-only"
            role="status"
            aria-live="polite"
            data-demo-status
          ></p>
        </form>

      </main>
    </div>
  </body>
</html>
