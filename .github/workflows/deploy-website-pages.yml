name: 部署 CoreStudio 官网

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署官网
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 准备官网文件
        run: |
          mkdir -p "$RUNNER_TEMP/corestudio-site"
          cp -R website/. "$RUNNER_TEMP/corestudio-site/"
          mkdir -p "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Excalifont"
          cp excalidraw/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Excalifont/"
          mkdir -p "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai"
          cp excalidraw/packages/excalidraw/fonts/Xiaolai/Xiaolai-Regular-0facdf1ea213ba40261022f5d5ed4493.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai/"
          cp excalidraw/packages/excalidraw/fonts/Xiaolai/Xiaolai-Regular-f8ee5d36068a42b51d0e4a1116cfcec1.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai/"
          cp excalidraw/packages/excalidraw/fonts/Xiaolai/Xiaolai-Regular-79d494361ae093b69e74ee9dbe65bfd4.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai/"
          cp excalidraw/packages/excalidraw/fonts/Xiaolai/Xiaolai-Regular-74e2263a91439c25b91d5132ce9f4d62.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai/"
          cp excalidraw/packages/excalidraw/fonts/Xiaolai/Xiaolai-Regular-145aa02cdd91946e67dc934e1acffe75.woff2 "$RUNNER_TEMP/corestudio-site/excalidraw/packages/excalidraw/fonts/Xiaolai/"

      - name: 上传官网文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/corestudio-site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
