<!DOCTYPE html>
<html lang="zh-CN" class="image-board-app" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CoreStudio · 右侧栏完整状态 Lab</title>
    <link rel="stylesheet" href="../src/app/styles/designTokens.css" />
    <style>
      @font-face {
        font-family: Assistant;
        src: url("../../../packages/excalidraw/fonts/Assistant/Assistant-Regular.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Assistant;
        src: url("../../../packages/excalidraw/fonts/Assistant/Assistant-SemiBold.woff2")
          format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        font-family: var(--ui-font);
        font-synthesis: none;
        --side: var(--corestudio-right-sidebar-width);
        --page: var(--color-surface-low);
        --stage: var(--color-surface-mid);
        --surface: var(--island-bg-color);
        --muted: var(--corestudio-secondary-text-color, var(--color-gray-70));
        --border: var(--default-border-color);
        --inline: var(--ui-space-2xl);
        --block: var(--ui-space-lg);
        --section-gap: var(--ui-space-2xl);
        --major: var(--ui-text-size-md);
        --body: var(--ui-text-size-md);
        --label: 64px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text-primary-color);
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .lab {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .lab-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ui-space-2xl);
        padding: var(--ui-space-xl) var(--ui-space-2xl);
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .kicker {
        margin: 0 0 var(--ui-space-xs);
        color: var(--color-primary-darkest);
        font-size: var(--ui-text-size-xs);
        font-weight: var(--font-weight-semibold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .lab-header h1 {
        margin: 0;
        font-size: var(--ui-text-size-page-title);
        line-height: var(--ui-line-height-tight);
      }
      .lab-header p:last-child {
        max-width: 760px;
        margin: var(--ui-space-sm) 0 0;
        color: var(--muted);
        font-size: var(--ui-text-size-md);
        line-height: var(--ui-line-height-relaxed);
      }
      .badge {
        flex: none;
        padding: var(--ui-space-xs) var(--ui-space-sm);
        border: 1px solid
          color-mix(in srgb, var(--color-primary) 28%, var(--border));
        border-radius: var(--border-radius-md);
        background: var(--color-surface-high);
        color: var(--color-primary-darkest);
        font-size: var(--ui-text-size-xs);
        font-weight: var(--font-weight-semibold);
      }
      .lab-body {
        min-height: 0;
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr);
      }
      .controls {
        min-height: 0;
        overflow: auto;
        padding: var(--ui-space-2xl);
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .control-group + .control-group {
        margin-top: var(--ui-space-2xl);
        padding-top: var(--ui-space-2xl);
        border-top: 1px solid var(--border);
      }
      .control-group h2 {
        margin: 0 0 var(--ui-space-lg);
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
      }
      .field {
        display: grid;
        gap: var(--ui-space-xs);
      }
      .field + .field {
        margin-top: var(--ui-space-xl);
      }
      .field label {
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        font-weight: var(--font-weight-semibold);
      }
      select {
        width: 100%;
        height: var(--ui-button-height-md);
        padding: 0 var(--ui-space-md);
        border: 1px solid var(--color-border-outline-variant);
        border-radius: var(--border-radius-lg);
        background: var(--input-bg-color);
        outline: none;
      }
      select:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: var(--ui-space-xxs);
      }
      .state-note,
      .coverage {
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        line-height: var(--ui-line-height-relaxed);
      }
      .state-note {
        margin: var(--ui-space-lg) 0 0;
      }
      .coverage {
        display: grid;
        gap: var(--ui-space-sm);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .coverage li {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--ui-space-sm);
      }
      .coverage li:before {
        content: "✓";
        color: var(--color-primary);
        font-weight: var(--font-weight-semibold);
      }
      .stage {
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: start center;
        overflow: auto;
        padding: var(--ui-space-2xl);
        background: var(--stage);
      }
      .preview {
        display: grid;
        gap: var(--ui-space-lg);
        justify-items: center;
      }
      .preview-caption {
        width: var(--side);
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: var(--ui-text-size-xs);
      }
      .sidebar {
        width: var(--side);
        height: min(800px, calc(100vh - 154px));
        min-height: 620px;
        display: grid;
        grid-template-rows: 64px minmax(0, 1fr);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--inline);
        border-bottom: 1px solid var(--border);
      }
      .sidebar-header h2 {
        margin: 0;
        font-size: var(--ui-text-size-title);
        font-weight: var(--font-weight-bold);
        line-height: var(--ui-line-height-tight);
      }
      .icon-button,
      .tool-button,
      .copy-button {
        width: var(--ui-control-size-md);
        height: var(--ui-control-size-md);
        min-width: var(--ui-control-size-md);
        display: inline-grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: var(--border-radius-md);
        background: transparent;
      }
      .icon-button:hover,
      .tool-button:hover,
      .copy-button:hover {
        background: var(--button-hover-bg);
      }
      .sidebar-scroll {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .sidebar-section {
        padding: var(--block) var(--inline) var(--section-gap);
        border-bottom: 1px solid var(--border);
      }
      .sidebar-section:last-child {
        border-bottom: 0;
      }
      .major-title {
        margin: 0 0 var(--ui-space-lg);
        font-size: var(--major);
        font-weight: var(--font-weight-semibold);
        line-height: var(--ui-line-height-normal);
      }
      .element-empty,
      .inspector-empty {
        margin: 0;
        color: var(--muted);
        font-size: var(--body);
        line-height: var(--ui-line-height-relaxed);
      }
      .empty-card {
        display: grid;
        gap: var(--ui-space-sm);
        padding-top: var(--ui-space-xs);
      }
      .empty-card h3 {
        margin: 0;
        font-size: var(--ui-text-size-md);
      }
      .action-grid {
        display: grid;
        gap: var(--ui-space-xl);
      }
      .action-row {
        display: grid;
        gap: var(--ui-space-sm);
      }
      .action-row > span {
        font-size: var(--ui-text-size-sm);
        font-weight: var(--font-weight-medium);
        line-height: var(--ui-line-height-normal);
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--ui-space-sm);
      }
      .tool-button {
        border: 1px solid transparent;
        background: var(--color-surface-mid);
      }
      .tool-button.is-active {
        border-color: color-mix(
          in srgb,
          var(--color-primary) 30%,
          var(--border)
        );
        background: var(--color-surface-high);
        color: var(--color-primary-darkest);
      }
      .range-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--ui-space-sm);
        align-items: center;
      }
      .range-wrap input {
        width: 100%;
        accent-color: var(--color-primary);
      }
      .range-wrap output {
        min-width: 32px;
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        text-align: right;
      }
      .action-footer {
        display: flex;
        justify-content: flex-end;
        padding-top: var(--ui-space-xs);
      }
      .ui-button {
        height: var(--ui-button-height-sm);
        min-height: var(--ui-button-height-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--ui-space-sm);
        padding: 0 var(--ui-button-padding-inline-sm);
        border: 1px solid var(--default-border-color);
        border-radius: var(--border-radius-lg);
        background: var(--island-bg-color);
        color: var(--text-primary-color);
        font-size: var(--ui-text-size-md);
        font-weight: var(--font-weight-regular);
        line-height: 1.2;
        white-space: nowrap;
      }
      .ui-button:hover {
        border-color: var(--color-surface-primary-container);
        background: var(--color-surface-high);
      }
      .ui-button--primary {
        border-color: var(--color-primary);
        background: var(--color-primary);
        color: var(--color-icon-white);
        font-weight: var(--font-weight-semibold);
      }
      .ui-button--primary:hover {
        border-color: var(--color-primary-hover);
        background: var(--color-primary-hover);
      }
      .inspector {
        display: grid;
        gap: var(--section-gap);
      }
      .asset-overview {
        display: grid;
        gap: var(--ui-space-lg);
      }
      .asset-overview > .major-title {
        margin-bottom: 0;
      }
      .palette {
        display: block;
      }
      .swatches {
        display: flex;
        gap: var(--ui-space-sm);
      }
      .swatch {
        width: var(--ui-control-size-md);
        height: var(--ui-control-size-md);
        padding: 0;
        border: 0;
        border-radius: var(--border-radius-md);
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, var(--text-primary-color) 18%, transparent);
      }
      .palette-message {
        margin: 0;
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        line-height: var(--ui-line-height-relaxed);
      }
      .generation,
      .chain {
        display: grid;
        gap: var(--ui-space-lg);
      }
      .chain {
        padding-top: var(--ui-space-2xl);
        border-top: 1px solid var(--border);
      }
      .generation > h3,
      .chain > h3 {
        margin: 0;
        font-size: var(--ui-text-size-md);
        font-weight: var(--font-weight-semibold);
        line-height: var(--ui-line-height-relaxed);
      }
      .file-details {
        color: var(--muted);
      }
      .file-details summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: var(--ui-button-height-sm);
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        line-height: var(--ui-line-height-normal);
        cursor: pointer;
        list-style: none;
      }
      .file-details summary::-webkit-details-marker {
        display: none;
      }
      .file-details summary::after {
        content: "⌄";
        transition: transform 120ms ease;
      }
      .file-details[open] summary::after {
        transform: rotate(180deg);
      }
      .file-details .meta {
        padding-top: var(--ui-space-md);
      }
      .meta {
        display: grid;
        gap: var(--ui-space-sm);
        margin: 0;
      }
      .meta-row {
        min-width: 0;
        display: grid;
        grid-template-columns: var(--label) minmax(0, 1fr);
        gap: var(--ui-space-sm);
        align-items: baseline;
      }
      .meta-row.wide {
        grid-template-columns: minmax(0, 1fr);
        gap: var(--ui-space-xs);
      }
      .meta dt {
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        font-weight: var(--font-weight-medium);
        line-height: var(--ui-line-height-relaxed);
      }
      .meta dd {
        min-width: 0;
        margin: 0;
        font-size: var(--body);
        line-height: var(--ui-line-height-relaxed);
        overflow-wrap: anywhere;
      }
      .id-value {
        display: flex;
        align-items: center;
        gap: var(--ui-space-xs);
      }
      .id-value code {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: inherit;
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ui-space-sm);
      }
      .section-header h4 {
        margin: 0;
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        font-weight: var(--font-weight-medium);
      }
      .prompt {
        display: grid;
        gap: var(--ui-space-sm);
        padding: var(--ui-space-lg);
        border: 1px solid var(--border);
        border-radius: var(--border-radius-lg);
        background: color-mix(
          in srgb,
          var(--color-surface-mid) 56%,
          var(--surface)
        );
      }
      .prompt p {
        margin: 0;
        font-size: var(--body);
        line-height: var(--ui-line-height-relaxed);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .reference {
        color: var(--color-primary);
        font-weight: var(--font-weight-semibold);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .chain-list {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .chain-item {
        position: relative;
        display: grid;
        grid-template-columns: var(--ui-space-xl) minmax(0, 1fr);
        gap: var(--ui-space-sm);
        padding-bottom: var(--ui-space-sm);
      }
      .chain-item:after {
        content: "";
        position: absolute;
        left: calc(var(--ui-space-xl) / 2);
        top: var(--ui-space-xl);
        bottom: calc(0px - var(--ui-space-sm));
        width: 1px;
        background: var(--border);
      }
      .chain-item:last-child:after {
        display: none;
      }
      .chain-marker {
        z-index: 1;
        width: var(--ui-space-sm);
        height: var(--ui-space-sm);
        justify-self: center;
        margin-top: var(--ui-space-md);
        border: 1px solid var(--color-border-outline-variant);
        border-radius: 50%;
        background: var(--surface);
      }
      .chain-item.current .chain-marker {
        border-color: var(--color-primary);
        background: var(--color-primary);
        outline: var(--ui-space-xxs) solid var(--surface);
      }
      .chain-content {
        min-width: 0;
        display: grid;
        gap: var(--ui-space-xs);
        padding: var(--ui-space-sm) var(--ui-space-md);
        border-radius: var(--border-radius-lg);
      }
      .chain-item.current .chain-content {
        background: color-mix(
          in srgb,
          var(--color-surface-primary-container) 64%,
          transparent
        );
      }
      .chain-heading {
        display: flex;
        justify-content: space-between;
        gap: var(--ui-space-sm);
        font-size: var(--ui-text-size-sm);
      }
      .chain-heading time {
        flex: none;
        color: var(--muted);
      }
      .chain-content p {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        font-size: var(--body);
        line-height: var(--ui-line-height-relaxed);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .task-status {
        display: grid;
        gap: var(--ui-space-lg);
      }
      .task-state {
        display: grid;
        grid-template-columns: var(--ui-space-lg) minmax(0, 1fr);
        align-items: start;
        gap: var(--ui-space-sm);
        padding: var(--ui-space-md) var(--ui-space-lg);
        border-radius: var(--border-radius-lg);
        background: color-mix(
          in srgb,
          var(--color-surface-primary-container) 64%,
          transparent
        );
      }
      .task-state.is-error {
        background: var(--color-danger-background);
        color: var(--color-danger-color);
      }
      .status-dot {
        width: var(--ui-space-sm);
        height: var(--ui-space-sm);
        margin-top: var(--ui-space-xs);
        border-radius: 50%;
        background: var(--color-primary);
      }
      .task-state.is-error .status-dot {
        background: var(--color-danger);
      }
      .task-state-copy {
        min-width: 0;
        display: grid;
        gap: var(--ui-space-xs);
      }
      .task-state-copy strong {
        font-size: var(--body);
        font-weight: var(--font-weight-semibold);
        line-height: var(--ui-line-height-normal);
      }
      .task-state-copy span {
        color: var(--muted);
        font-size: var(--ui-text-size-sm);
        font-weight: var(--font-weight-regular);
        line-height: var(--ui-line-height-relaxed);
      }
      .task-state.is-error .task-state-copy span {
        color: var(--color-danger-color);
      }
      .error-details-body {
        display: grid;
        gap: var(--ui-space-sm);
        padding-top: var(--ui-space-md);
      }
      .error-pre {
        max-height: 150px;
        overflow: auto;
        padding: var(--ui-space-md);
        border-radius: var(--border-radius-md);
        background: var(--color-surface-mid);
        font-family: ui-monospace, monospace;
        font-size: var(--ui-text-size-xs);
        white-space: pre-wrap;
      }
      .tooltip {
        position: fixed;
        z-index: 10;
        display: none;
        min-width: 10ch;
        padding: var(--ui-space-xs) var(--ui-space-sm);
        border-radius: var(--border-radius-md);
        background: var(--text-primary-color);
        color: var(--island-bg-color);
        font-size: var(--ui-text-size-sm);
        text-align: center;
        pointer-events: none;
      }
      .tooltip.visible {
        display: block;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: var(--ui-space-2xl);
        z-index: 20;
        display: none;
        align-items: center;
        gap: var(--ui-space-sm);
        padding: var(--ui-space-md) var(--ui-space-lg);
        border: 1px solid var(--border);
        border-radius: var(--border-radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-island);
        font-size: var(--ui-text-size-sm);
        transform: translateX(-50%);
      }
      .toast.visible {
        display: flex;
      }
      .toast:before {
        content: "";
        width: var(--ui-space-sm);
        height: var(--ui-space-sm);
        border-radius: 50%;
        background: var(--color-primary);
      }
      @media (max-width: 840px) {
        .lab-header {
          align-items: flex-start;
        }
        .lab-body {
          grid-template-columns: 1fr;
        }
        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="lab">
      <header class="lab-header">
        <div>
          <p class="kicker">CoreStudio right sidebar lab</p>
          <h1>右侧栏完整状态</h1>
          <p>
            把元素编辑、图片信息、任务状态、配色和编辑链放进同一个可切换的评审页，集中调整排版，不直接改产品组件。
          </p>
        </div>
        <span class="badge">DEVELOPMENT ONLY</span>
      </header>
      <div class="lab-body">
        <aside class="controls" aria-label="预览参数">
          <section class="control-group">
            <h2>预览设置</h2>
            <div class="field">
              <label for="scenario">面板状态</label
              ><select id="scenario">
                <option value="generated" selected>生成图片</option>
                <option value="generated-minimal">生成图片 · 最少信息</option>
                <option value="imported">导入图片</option>
                <option value="task-pending">生成任务 · 进行中</option>
                <option value="task-error">生成任务 · 失败</option>
                <option value="shape">普通元素</option>
                <option value="crop">图片裁剪中</option>
                <option value="empty">未选择元素</option>
              </select>
            </div>
            <div class="field">
              <label for="palette">配色状态</label
              ><select id="palette">
                <option value="ready" selected>已提取</option>
                <option value="loading">提取中</option>
                <option value="failed">读取失败</option>
                <option value="hidden">不显示</option>
              </select>
            </div>
            <div class="field">
              <label for="theme">主题</label
              ><select id="theme">
                <option value="light" selected>浅色</option>
                <option value="dark">深色</option>
              </select>
            </div>
            <p class="state-note" id="state-note"></p>
          </section>
          <section class="control-group">
            <h2>覆盖范围</h2>
            <ul class="coverage">
              <li>元素编辑：空、常规、裁剪</li>
              <li>图片：导入、生成</li>
              <li>任务：进行中、失败与详细报错</li>
              <li>配色：完成、加载、失败、隐藏</li>
              <li>信息：元数据、提示词、参数、编辑链</li>
            </ul>
          </section>
        </aside>
        <section class="stage" aria-label="右侧栏预览">
          <div class="preview">
            <div class="preview-caption">
              <span id="preview-label"></span>
            </div>
            <aside class="sidebar" aria-label="详情">
              <header class="sidebar-header">
                <h2>详情</h2>
                <button class="icon-button" aria-label="关闭详情">×</button>
              </header>
              <div class="sidebar-scroll" id="sidebar-content"></div>
            </aside>
          </div>
        </section>
      </div>
    </main>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        root = document.documentElement,
        scenario = $("#scenario"),
        palette = $("#palette"),
        theme = $("#theme"),
        content = $("#sidebar-content"),
        tooltip = $("#tooltip"),
        toast = $("#toast");
      let toastTimer;
      const states = {
        generated: [
          "生成图片",
          "首屏只保留识别图片所需的信息，低频文件参数按需展开。",
        ],
        "generated-minimal": [
          "生成图片 · 最少信息",
          "只有必要图片信息和短提示词，不用空字段撑高面板。",
        ],
        imported: ["导入图片", "不显示空的模型、服务、种子和编辑链。"],
        "task-pending": [
          "生成任务 · 进行中",
          "状态优先，只显示任务当前已经成立的信息。",
        ],
        "task-error": [
          "生成任务 · 失败",
          "直接说明失败原因，技术报错按需展开。",
        ],
        shape: ["普通元素", "只有元素编辑，图片信息保持明确空态。"],
        crop: ["图片裁剪中", "裁剪动作保持选中，并提供明确的完成入口。"],
        empty: ["未选择元素", "元素编辑和图片信息同时使用轻量空态。"],
      };
      const icon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.2" y="5.2" width="7" height="7" rx="1.2" stroke="currentColor"/><path d="M10.8 5.2V4.4c0-.8-.4-1.2-1.2-1.2H4.4c-.8 0-1.2.4-1.2 1.2v5.2c0 .8.4 1.2 1.2 1.2h.8" stroke="currentColor"/></svg>`;
      function elements(s) {
        if (s === "empty")
          return `<section class="sidebar-section"><h3 class="major-title">元素编辑</h3><p class="element-empty">选中元素后可在这里调整样式。</p></section>`;
        const image = [
          "generated",
          "generated-minimal",
          "imported",
          "crop",
        ].includes(s);
        return `<section class="sidebar-section"><h3 class="major-title">元素编辑</h3><div class="action-grid"><div class="action-row"><span>边角</span><div class="button-row"><button class="tool-button is-active" title="直角">⌜</button><button class="tool-button" title="圆角">╭</button></div></div><div class="action-row"><span>透明度</span><div class="range-wrap"><input id="opacity" type="range" min="0" max="100" value="100"><output id="opacity-value">100</output></div></div><div class="action-row"><span>图层</span><div class="button-row"><button class="tool-button" title="置于底层">⇩</button><button class="tool-button" title="下移一层">↓</button><button class="tool-button" title="上移一层">↑</button><button class="tool-button" title="置于顶层">⇧</button></div></div><div class="action-row"><span>操作</span><div class="button-row"><button class="tool-button" title="复制元素">⧉</button><button class="tool-button" title="删除元素">⌫</button>${
          image
            ? `<button class="tool-button" title="复制图片链接">↗</button><button class="tool-button ${
                s === "crop" ? "is-active" : ""
              }" title="裁剪图片">⌗</button>`
            : ""
        }</div></div>${
          s === "crop"
            ? '<div class="action-footer"><button class="ui-button ui-button--primary">完成裁切</button></div>'
            : ""
        }</div></section>`;
      }
      function colors(s) {
        if (
          !["generated", "generated-minimal", "imported", "crop"].includes(s) ||
          palette.value === "hidden"
        )
          return "";
        if (palette.value !== "ready")
          return `<section class="sidebar-section palette"><h3 class="major-title">配色</h3><p class="palette-message">${
            palette.value === "loading" ? "正在提取配色…" : "无法读取图片颜色"
          }</p></section>`;
        return `<section class="sidebar-section palette"><h3 class="major-title">配色</h3><div class="swatches">${[
          "#E7E1D8",
          "#B7A58E",
          "#72665B",
          "#302823",
          "#171819",
          "#D8D8DA",
        ]
          .map(
            (x) =>
              `<button class="swatch" aria-label="复制色值 ${x}" data-color="${x}" style="background:${x}"></button>`,
          )
          .join("")}</div></section>`;
      }
      function metadata(title) {
        return `<dl class="meta"><div class="meta-row"><dt>名称</dt><dd>${title}</dd></div><div class="meta-row"><dt>尺寸</dt><dd>1548 × 1016</dd></div><div class="meta-row"><dt>格式</dt><dd>PNG</dd></div></dl>`;
      }
      function fileDetails(source) {
        return `<details class="file-details"><summary>更多信息</summary><dl class="meta"><div class="meta-row"><dt>来源</dt><dd>${source}</dd></div><div class="meta-row"><dt>创建时间</dt><dd>2026/9/8 18:19:13</dd></div><div class="meta-row"><dt>文件位置</dt><dd>/工业设计项目/assets/desktop-cnc-render.png</dd></div><div class="meta-row"><dt>图片 ID</dt><dd class="id-value"><code>img_7f3c9e2a</code><button class="copy-button" title="复制图片 ID">${icon}</button></dd></div></dl></details>`;
      }
      function assetOverview(title, source) {
        return `<div class="asset-overview"><h3 class="major-title">图片信息</h3>${metadata(
          title,
        )}${fileDetails(source)}</div>`;
      }
      function generation(minimal = false) {
        const prompt = minimal
          ? "保持结构不变，优化金属和玻璃材质。"
          : `保持现有桌面 CNC 的结构比例，左侧使用深色阳极氧化铝和透明玻璃，右侧保留浅色金属控制区。优化材质、光影和接缝细节，并参考 <span class="reference">参考图 1</span> 的柔和摄影棚背景。`;
        return `<section class="generation"><h3>生成信息</h3><div class="prompt"><div class="section-header"><h4>提示词</h4><button class="copy-button" title="复制提示词">${icon}</button></div><p>${prompt}</p></div>${
          minimal
            ? ""
            : `<dl class="meta"><div class="meta-row"><dt>模型</dt><dd>GPT Image 2</dd></div></dl>`
        }</section>`;
      }
      function chain() {
        return `<section class="chain"><h3>编辑链</h3><ol class="chain-list"><li class="chain-item"><span class="chain-marker"></span><div class="chain-content"><div class="chain-heading"><strong>导入图片</strong><time>9/8 17:03</time></div><p>桌面 CNC 产品模型正视图。</p></div></li><li class="chain-item current"><span class="chain-marker"></span><div class="chain-content"><div class="chain-heading"><strong>当前图片</strong><time>9/8 18:19</time></div><p>优化金属、玻璃和摄影棚光影。</p></div></li><li class="chain-item"><span class="chain-marker"></span><div class="chain-content"><div class="chain-heading"><strong>AI 生成图片</strong><time>9/8 18:42</time></div><p>细化控制区和门体接缝。</p></div></li></ol></section>`;
      }
      function task(error) {
        const errorDetails = error
          ? `<details class="file-details"><summary>错误详情</summary><div class="error-details-body"><div class="section-header"><h4>技术信息</h4><button class="copy-button" title="复制详细报错">${icon}</button></div><div class="error-pre">HTTP 400 INVALID_IMAGE\nThe input image could not be decoded.\n\nGenerationRequestError\n  at requestImage\n  at runGenerationTask</div></div></details>`
          : "";
        const status = `<section class="sidebar-section"><div class="task-status"><h3 class="major-title">生成状态</h3><div class="task-state ${
          error ? "is-error" : ""
        }"><span class="status-dot"></span><div class="task-state-copy"><strong>${
          error ? "生成失败" : "正在生成图片"
        }</strong><span>${
          error ? "图片输入无法读取" : "开始于 9/8 18:47"
        }</span></div></div>${errorDetails}</div></section>`;
        const generationInfo = `<section class="sidebar-section"><section class="generation"><h3>生成信息</h3><div class="prompt"><div class="section-header"><h4>提示词</h4><button class="copy-button" title="复制提示词">${icon}</button></div><p>保持产品结构，生成一张克制的工业设计渲染图。</p></div><dl class="meta"><div class="meta-row"><dt>模型</dt><dd>GPT Image 2</dd></div></dl></section></section>`;
        return status + generationInfo;
      }
      function images(s) {
        let sections;
        if (["empty", "shape"].includes(s))
          sections =
            '<section class="sidebar-section"><div class="empty-card"><h3>图片信息</h3><p class="inspector-empty">选中一张 AI 生成图片，或一个生成任务占位框，查看提示词、模型、尺寸和任务状态。</p></div></section>';
        else if (s === "task-pending") sections = task(false);
        else if (s === "task-error") sections = task(true);
        else if (s === "imported")
          sections = `<section class="sidebar-section">${assetOverview(
            "工业设计参考图.png",
            "本地导入",
          )}</section>${colors(s)}`;
        else if (s === "generated-minimal")
          sections = `<section class="sidebar-section">${assetOverview(
            "AI 生成图片",
            "CoreStudio 图片生成",
          )}</section>${colors(s)}<section class="sidebar-section">${generation(
            true,
          )}</section>`;
        else
          sections = `<section class="sidebar-section">${assetOverview(
            "桌面 CNC 设备精修图",
            "CoreStudio 图片生成 · 由 Codex 发起",
          )}</section>${colors(
            s,
          )}<section class="sidebar-section"><div class="inspector">${generation()}${chain()}</div></section>`;
        return sections;
      }
      function tip(target, text) {
        const r = target.getBoundingClientRect();
        tooltip.textContent = text;
        tooltip.classList.add("visible");
        const t = tooltip.getBoundingClientRect();
        tooltip.style.left = `${Math.max(
          5,
          r.left + r.width / 2 - t.width / 2,
        )}px`;
        tooltip.style.top = `${r.bottom + 5}px`;
      }
      function hideTip() {
        tooltip.classList.remove("visible");
      }
      function notice(text) {
        clearTimeout(toastTimer);
        toast.textContent = text;
        toast.classList.add("visible");
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
      }
      function bind() {
        const o = $("#opacity");
        o?.addEventListener(
          "input",
          () => ($("#opacity-value").value = o.value),
        );
        document
          .querySelectorAll(".copy-button")
          .forEach((b) => b.addEventListener("click", () => notice("已复制")));
        document.querySelectorAll(".swatch").forEach((b) => {
          b.addEventListener("pointerenter", () => tip(b, b.dataset.color));
          b.addEventListener("pointerleave", hideTip);
          b.addEventListener("focus", () => tip(b, b.dataset.color));
          b.addEventListener("blur", hideTip);
          b.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(b.dataset.color);
            } catch {}
            notice(`色值 ${b.dataset.color} 已复制`);
          });
        });
      }
      function render() {
        const s = scenario.value;
        root.dataset.theme = theme.value;
        palette.disabled = ![
          "generated",
          "generated-minimal",
          "imported",
          "crop",
        ].includes(s);
        $("#preview-label").textContent = states[s][0];
        $("#state-note").textContent = states[s][1];
        content.innerHTML = elements(s) + images(s);
        bind();
        history.replaceState(
          null,
          "",
          `?${new URLSearchParams({
            scenario: s,
            palette: palette.value,
            theme: theme.value,
          })}`,
        );
      }
      const initial = new URLSearchParams(location.search),
        valid = {
          scenario: states,
          palette: { ready: 1, loading: 1, failed: 1, hidden: 1 },
          theme: { light: 1, dark: 1 },
        };
      [scenario, palette, theme].forEach((c) => {
        const v = initial.get(c.id);
        if (valid[c.id][v]) c.value = v;
        c.addEventListener("change", render);
      });
      render();
    </script>
  </body>
</html>
