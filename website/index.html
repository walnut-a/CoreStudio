<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CoreStudio is a local-first image-generation canvas built on Excalidraw, with your choice of models and agent write-back."
    />
    <meta name="theme-color" content="#f8f8f7" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="CoreStudio · A local-first canvas for image generation" />
    <meta
      property="og:description"
      content="Keep the canvas, references, generated images, and agent collaboration in one local project."
    />
    <meta property="og:url" content="https://getcorestudio.com/" />
    <meta property="og:image" content="https://getcorestudio.com/assets/corestudio-social-card.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An industrial-design concept on the CoreStudio canvas" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>CoreStudio · A local-first canvas for image generation</title>
    <link rel="icon" href="assets/corestudio-favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/corestudio-apple-touch-icon.png" />
    <link rel="canonical" href="https://getcorestudio.com/" />
    <link rel="alternate" hreflang="en" href="https://getcorestudio.com/" />
    <link rel="alternate" hreflang="zh-CN" href="https://getcorestudio.com/zh/" />
    <link rel="alternate" hreflang="x-default" href="https://getcorestudio.com/" />
    <link rel="stylesheet" href="styles.css?v=20260820-10" />
    <script type="module" src="main.js?v=20260820-7"></script>
  </head>
  <body class="page-en">
    <!--
    THESIS: The CoreStudio website is a living canvas, not a page that explains one in stacked marketing sections.
    OWN-WORLD: Paper-white dotted space, native CoreStudio controls, silver industrial imagery, precise selection geometry, and quiet production status feedback.
    STORY: References enter a local project, a model generates on the canvas, and a Codex cursor writes the result back before the visitor downloads the macOS app.
    FIRST VIEWPORT: A selected headline and reference cluster balance a large generated object; toolbar, minimap, composer, and download action form the working edge of the canvas.
    FORM: Center workshop canvas from the user-pinned direction; concept seed 4fb4245c.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#main">Skip to the canvas</a>

    <div class="canvas-app" data-canvas-app data-active-tool="select">
      <header class="canvas-header">
        <a class="brand" href="#canvas-home" aria-label="CoreStudio home">
          <img
            src="assets/corestudio-icon-256.png"
            srcset="assets/corestudio-icon-64.webp 64w, assets/corestudio-icon-256.webp 256w"
            sizes="34px"
            width="34"
            height="34"
            alt=""
          />
          <span>CoreStudio</span>
        </a>

        <div class="canvas-toolbar" role="toolbar" aria-label="Canvas demo tools">
          <button class="tool-button is-active" type="button" data-tool="select" aria-label="Select objects" aria-pressed="true">
            <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 6l4.153 11.793a0.365 .365 0 0 0 .331 .207a0.366 .366 0 0 0 .332-.207L13 13l4.787-1.994a0.355 .355 0 0 0 .213-.323a0.355 .355 0 0 0-.213-.323L6 6Z" /><path d="M13.5 13.5 18 18" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="hand" aria-label="Pan the canvas" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0V12" /><path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0V12" /><path d="M14 5.5a1.5 1.5 0 0 1 3 0V12" /><path d="M17 7.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2h.208a6 6 0 0 1-5.012-2.7A69.74 69.74 0 0 1 7 19c-.312-.479-1.407-2.388-3.286-5.728a1.5 1.5 0 0 1 .536-2.022 1.867 1.867 0 0 1 2.28.28L8 13" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="shape" aria-label="Show canvas shapes" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="image" aria-label="Open image generation" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.25 18.25h11.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H6.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5Z" /><path d="m7.75 15.75 3-3 2.25 2.25 1.25-1.25 2 2" /><path d="M14.75 4.75 16 7.25l2.5 1.25L16 9.75l-1.25 2.5-1.25-2.5L11 8.5l2.5-1.25 1.25-2.5Z" /></svg>
          </button>
        </div>

        <div class="header-actions">
          <a class="header-link header-github" href="https://github.com/walnut-a/CoreStudio" target="_blank" rel="noreferrer">GitHub</a>
          <a class="header-link language-link" href="zh/index.html" lang="zh-CN" hreflang="zh-CN">中文</a>
          <a class="download-button" href="https://github.com/walnut-a/CoreStudio/releases/latest" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /><path d="m7 11 5 5 5-5" /><path d="M12 4v12" /></svg>
            <span>Download for macOS</span>
          </a>
        </div>
      </header>

      <main class="canvas-main" id="main" tabindex="-1">
        <div class="canvas-viewport" data-canvas-viewport aria-label="Interactive CoreStudio product demonstration">
          <div class="canvas-plane" data-canvas-plane>
            <div class="project-tab" aria-hidden="true">
              <span class="project-home">
                <svg viewBox="0 0 24 24"><path d="m5.25 10.25 6.75-5.5 6.75 5.5" /><path d="M7.25 9.25v9h9.5v-9" /><path d="M10 18.25v-5.5h4v5.5" /></svg>
              </span>
              <span>Dieter Rams references</span>
              <span class="project-close"><svg viewBox="0 0 24 24"><path d="m7.5 7.5 9 9" /><path d="m16.5 7.5-9 9" /></svg></span>
            </div>

            <section class="scene-title is-selected" id="canvas-home" data-scene-object>
              <div class="scene-heading">
                <div class="selection-box" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                <h1>A local-first canvas<br />for image generation.</h1>
              </div>
              <p>Built on Excalidraw. Keep the project local, choose your models, and let agents write back.</p>
            </section>

            <button class="scene-chip scene-chip-local" type="button" data-camera-target="overview">
              <strong>Local project</strong>
              <span>References and results stay together</span>
            </button>

            <figure class="reference-board" data-scene-object>
              <div class="reference-grid" aria-label="Four Dieter Rams design references">
                <span class="reference-tile reference-tile-a"><img src="assets/dieter-rams-tp1.webp" alt="Braun TP1 portable radio and phonograph designed by Dieter Rams" /></span>
                <span class="reference-tile reference-tile-b"><img src="assets/dieter-rams-sk4-v2.webp" alt="Braun SK 4 radio-phonograph designed by Dieter Rams and Hans Gugelot" /></span>
                <span class="reference-tile reference-tile-c"><img src="assets/dieter-rams-t4.webp" alt="Braun T4 transistor radio designed by Dieter Rams" /></span>
                <span class="reference-tile reference-tile-d"><img src="assets/dieter-rams-et66-v2.webp" alt="Braun ET66 calculator designed by Dieter Rams and Dietrich Lubs" /></span>
              </div>
              <figcaption><span>4 references · saved locally</span><a href="https://github.com/walnut-a/CoreStudio/blob/main/website/THIRD_PARTY_ASSETS.md" target="_blank" rel="noreferrer">Image credits</a></figcaption>
            </figure>

            <svg class="canvas-connectors" viewBox="0 0 1400 780" aria-hidden="true">
              <defs>
                <marker id="arrow-end-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0 0 10 5 0 10" />
                </marker>
              </defs>
              <path class="connector connector-a" d="M455 510C578 510 624 382 740 362" marker-end="url(#arrow-end-en)" />
              <path class="connector connector-b" d="M455 585C590 606 635 482 740 452" marker-end="url(#arrow-end-en)" />
              <path class="connector connector-c" d="M455 648C584 682 652 598 740 542" marker-end="url(#arrow-end-en)" />
            </svg>

            <button class="scene-chip scene-chip-model" type="button" data-camera-target="generate">
              <strong>Your models</strong>
              <span>Quality, speed, or budget</span>
            </button>

            <figure class="generation-result" data-scene-object>
              <div class="result-frame">
                <span class="result-status" data-result-status data-generating="Generating" data-ready="Updated on canvas"><i></i><span data-result-status-label>Updated on canvas</span></span>
                <img class="result-image" src="assets/corestudio-canvas-result-rams-v2.webp" alt="Original modular tabletop audio controller generated in the CoreStudio demo" width="1536" height="1024" />
                <span class="result-corner result-corner-a"></span>
                <span class="result-corner result-corner-b"></span>
                <span class="result-corner result-corner-c"></span>
                <span class="result-corner result-corner-d"></span>
              </div>
              <figcaption>Illustrative generation demo</figcaption>
            </figure>

            <button class="scene-chip scene-chip-agent" type="button" data-camera-target="agent">
              <strong>Agent write-back</strong>
              <span>Current canvas, shared context</span>
            </button>

            <div class="agent-cursor" aria-hidden="true">
              <svg viewBox="0 0 32 38"><path d="M4 3 27 23l-11 1.6L10 35 4 3Z" /></svg>
              <span>Codex</span>
            </div>
            <div class="writeback-tag" aria-hidden="true"><i></i>Written back</div>
          </div>
        </div>

        <nav class="story-nav" aria-label="Canvas story">
          <button class="story-step is-active" type="button" data-camera-target="overview" aria-current="step">Project</button>
          <button class="story-step" type="button" data-camera-target="generate" aria-current="false">Generate</button>
          <button class="story-step" type="button" data-camera-target="agent" aria-current="false">Agent</button>
        </nav>

        <div class="canvas-dock canvas-dock-left">
          <div class="zoom-control is-expanded" data-zoom-control aria-label="Canvas zoom controls">
            <button type="button" data-zoom-out aria-label="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" /></svg></button>
            <button class="zoom-value" type="button" data-minimap-toggle aria-label="Close minimap, current zoom 90%" aria-pressed="true"><span data-zoom-label>90%</span></button>
            <button type="button" data-zoom-in aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.167v11.666M4.167 10h11.666" /></svg></button>
          </div>
          <div class="minimap is-open" data-minimap aria-label="Canvas minimap. Drag the viewport to pan the canvas.">
            <button class="minimap-target minimap-references" type="button" data-camera-target="overview" aria-label="Show project overview">
              <span class="minimap-marker minimap-reference-a"></span>
              <span class="minimap-marker minimap-reference-b"></span>
              <span class="minimap-marker minimap-reference-c"></span>
              <span class="minimap-marker minimap-reference-d"></span>
            </button>
            <svg class="minimap-flow" viewBox="0 0 224 144" aria-hidden="true">
              <path d="M77 58 C94 58 96 66 111 69" />
              <path d="M77 79 C94 79 97 75 111 72" />
            </svg>
            <button class="minimap-target minimap-result" type="button" data-camera-target="generate" aria-label="Show generated result"><span class="minimap-result-selection"></span></button>
            <span class="minimap-viewport" data-minimap-viewport></span>
          </div>
        </div>

        <form
          class="generation-composer"
          data-generation-form
          data-status-generating="Generating on the canvas…"
          data-status-generated="Image generated"
        >
          <label class="sr-only" for="generation-prompt-en">Describe the image to generate</label>
          <input id="generation-prompt-en" data-prompt-input value="A modular tabletop audio controller in warm white, charcoal, and muted orange" autocomplete="off" />
          <button class="composer-icon" type="button" data-composer-settings aria-label="Generation settings" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h5.25M13.75 7.5H19M12 5.75v3.5M5 16.5h8.25M16.75 16.5H19M15 14.75v3.5" /></svg>
          </button>
          <button class="generate-button" type="submit" data-generate-button>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.75 18.25 5.5a.7.7 0 0 1 .95.82l-3.85 12.9a.7.7 0 0 1-1.26.18l-3.05-4.65-4.98-1.72a.7.7 0 0 1-.06-1.28Z" /><path d="m11.05 14.7 3.7-3.7" /></svg>
            <span class="sr-only">Generate</span>
          </button>
          <p class="sr-only" role="status" aria-live="polite" data-demo-status></p>
        </form>

        <div class="canvas-links" aria-label="Project links">
          <a href="https://github.com/walnut-a/CoreStudio" target="_blank" rel="noreferrer">Source</a>
          <a href="https://github.com/walnut-a/CoreStudio/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT</a>
        </div>
      </main>
    </div>
  </body>
</html>
