<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CoreStudio 是基于 Excalidraw 的本地优先图片生成画布，支持自由选择模型并与 Codex 等 Agent 协作。"
    />
    <meta name="theme-color" content="#f8f8f7" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="CoreStudio · 本地优先的图片生成画布" />
    <meta property="og:description" content="把画布、参考素材、生成结果和 Agent 协作放进同一个本地项目。" />
    <meta property="og:url" content="https://getcorestudio.com/zh/" />
    <meta property="og:image" content="https://getcorestudio.com/assets/corestudio-social-card.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CoreStudio 画布中的工业设计概念图" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>CoreStudio · 本地优先的图片生成画布</title>
    <link rel="icon" href="../assets/corestudio-favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/corestudio-apple-touch-icon.png" />
    <link rel="canonical" href="https://getcorestudio.com/zh/" />
    <link rel="alternate" hreflang="zh-CN" href="https://getcorestudio.com/zh/" />
    <link rel="alternate" hreflang="en" href="https://getcorestudio.com/" />
    <link rel="alternate" hreflang="x-default" href="https://getcorestudio.com/" />
    <link rel="stylesheet" href="../styles.css?v=20260820-4" />
    <script type="module" src="../main.js?v=20260820-5"></script>
  </head>
  <body>
    <!--
    THESIS: CoreStudio 官网就是一张活的画布，不再用传统营销章节解释画布产品。
    OWN-WORLD: 纸白点阵空间、CoreStudio 原生控件、银色工业设计图像与精确选框；生成过程只使用克制的生产状态反馈。
    STORY: 参考素材进入本地项目，模型在画布中生成，Codex 光标把结果写回，访问者随后下载 macOS 客户端。
    FIRST VIEWPORT: 选中的标题和参考素材与大幅生成结果平衡；工具栏、迷你地图、输入框和下载动作构成画布工作边缘。
    FORM: 用户锁定的中心工作台画布；concept seed 4fb4245c。
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#main">跳到画布演示</a>

    <div class="canvas-app" data-canvas-app data-active-tool="select">
      <header class="canvas-header">
        <a class="brand" href="#canvas-home" aria-label="CoreStudio 首页">
          <img
            src="../assets/corestudio-icon-256.png"
            srcset="../assets/corestudio-icon-64.webp 64w, ../assets/corestudio-icon-256.webp 256w"
            sizes="34px"
            width="34"
            height="34"
            alt=""
          />
          <span>CoreStudio</span>
        </a>

        <div class="canvas-toolbar" role="toolbar" aria-label="画布演示工具">
          <button class="tool-button is-active" type="button" data-tool="select" aria-label="选择对象" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.8 18 13l-6.2 1.1L8.2 20 5 3.8Z" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="hand" aria-label="拖动画布" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 11V6.5a1.5 1.5 0 0 1 3 0V10m0 0V5a1.5 1.5 0 0 1 3 0v5m0 .5V6.2a1.5 1.5 0 0 1 3 0v6.3m0-2a1.5 1.5 0 0 1 3 0v3.8c0 3.7-2.7 6.7-6.5 6.7h-1.6a6.2 6.2 0 0 1-5-2.5l-3.1-4.1a1.6 1.6 0 0 1 2.4-2.1l1.8 1.6V11Z" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="shape" aria-label="查看画布图形" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5" /></svg>
          </button>
          <button class="tool-button" type="button" data-tool="image" aria-label="打开图片生成" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.25 18.25h11.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H6.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5Z" /><path d="m7.75 15.75 3-3 2.25 2.25 1.25-1.25 2 2" /><path d="M14.75 4.75 16 7.25l2.5 1.25L16 9.75l-1.25 2.5-1.25-2.5L11 8.5l2.5-1.25 1.25-2.5Z" /></svg>
          </button>
        </div>

        <div class="header-actions">
          <a class="header-link header-github" href="https://github.com/walnut-a/CoreStudio" target="_blank" rel="noreferrer">GitHub</a>
          <a class="header-link language-link" href="../index.html" lang="en" hreflang="en">EN</a>
          <a class="download-button" href="https://github.com/walnut-a/CoreStudio/releases/latest" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" /></svg>
            <span>下载 macOS 版</span>
          </a>
        </div>
      </header>

      <main class="canvas-main" id="main" tabindex="-1">
        <div class="canvas-viewport" data-canvas-viewport aria-label="CoreStudio 产品交互演示">
          <div class="canvas-plane" data-canvas-plane>
            <div class="project-tab" aria-hidden="true">
              <span class="project-home">
                <svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v8H4v-8Z" /><path d="M9 19v-5h6v5" /></svg>
              </span>
              <span>工业设计灯具</span>
              <span class="project-close">×</span>
            </div>

            <section class="scene-title is-selected" id="canvas-home" data-scene-object>
              <div class="scene-heading">
                <div class="selection-box" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                <h1>本地优先的<br />图片生成画布</h1>
              </div>
              <p>基于 Excalidraw。项目留在本地，模型自由选择，Agent 可直接写回。</p>
            </section>

            <div class="shape-cluster" data-shape-cluster data-scene-object aria-label="Excalidraw 图形与连线">
              <span class="shape-rectangle"></span>
              <span class="shape-circle"></span>
              <svg viewBox="0 0 150 90" aria-hidden="true"><path d="M10 72c34-65 72 30 128-45" /><path d="m128 22 10 5-7 9" /></svg>
            </div>

            <button class="scene-chip scene-chip-local" type="button" data-camera-target="overview">
              <strong>本地项目</strong>
              <span>参考素材与结果放在一起</span>
            </button>

            <figure class="reference-board" data-scene-object>
              <div class="reference-grid" aria-label="四张工业设计参考素材">
                <span class="reference-tile reference-tile-a"><img src="../assets/corestudio-reference-board.webp" alt="拉丝铝与琥珀色接缝参考" /></span>
                <span class="reference-tile reference-tile-b"><img src="../assets/corestudio-reference-board.webp" alt="工业设计草图参考" /></span>
                <span class="reference-tile reference-tile-c"><img src="../assets/corestudio-reference-board.webp" alt="铝合金旋钮细节参考" /></span>
                <span class="reference-tile reference-tile-d"><img src="../assets/corestudio-reference-board.webp" alt="银色流动曲面参考" /></span>
              </div>
              <figcaption>4 张参考 · 保存在本地</figcaption>
            </figure>

            <svg class="canvas-connectors" viewBox="0 0 1400 780" aria-hidden="true">
              <defs>
                <marker id="arrow-end-zh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0 0 10 5 0 10" />
                </marker>
              </defs>
              <path class="connector connector-a" d="M455 510C578 510 624 382 740 362" marker-end="url(#arrow-end-zh)" />
              <path class="connector connector-b" d="M455 585C590 606 635 482 740 452" marker-end="url(#arrow-end-zh)" />
              <path class="connector connector-c" d="M455 648C584 682 652 598 740 542" marker-end="url(#arrow-end-zh)" />
            </svg>

            <button class="scene-chip scene-chip-model" type="button" data-camera-target="generate">
              <strong>模型自由</strong>
              <span>按质量、速度或预算选择</span>
            </button>

            <figure class="generation-result" data-scene-object>
              <div class="result-frame">
                <span class="result-status" data-result-status data-generating="正在生成" data-ready="画布已更新"><i></i><span data-result-status-label>画布已更新</span></span>
                <img class="result-image" src="../assets/corestudio-canvas-result.webp" alt="CoreStudio 演示中生成的银色桌面灯具概念图" width="1536" height="1024" />
                <span class="result-corner result-corner-a"></span>
                <span class="result-corner result-corner-b"></span>
                <span class="result-corner result-corner-c"></span>
                <span class="result-corner result-corner-d"></span>
              </div>
              <figcaption>示意生成演示</figcaption>
            </figure>

            <button class="scene-chip scene-chip-agent" type="button" data-camera-target="agent">
              <strong>Agent 写回</strong>
              <span>共用当前画布与上下文</span>
            </button>

            <div class="agent-cursor" aria-hidden="true">
              <svg viewBox="0 0 32 38"><path d="M4 3 27 23l-11 1.6L10 35 4 3Z" /></svg>
              <span>Codex</span>
            </div>
            <div class="writeback-tag" aria-hidden="true"><i></i>已写回项目</div>
          </div>
        </div>

        <nav class="story-nav" aria-label="画布演示步骤">
          <button class="story-step is-active" type="button" data-camera-target="overview" aria-current="step">项目</button>
          <button class="story-step" type="button" data-camera-target="generate" aria-current="false">生成</button>
          <button class="story-step" type="button" data-camera-target="agent" aria-current="false">Agent</button>
        </nav>

        <div class="canvas-dock canvas-dock-left">
          <div class="zoom-control is-expanded" data-zoom-control aria-label="画布缩放控件">
            <button type="button" data-zoom-out aria-label="缩小画布"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <button class="zoom-value" type="button" data-minimap-toggle aria-label="关闭迷你地图，当前缩放 90%" aria-pressed="true"><span data-zoom-label>90%</span></button>
            <button type="button" data-zoom-in aria-label="放大画布"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
          </div>
          <div class="minimap is-open" data-minimap aria-label="画布迷你地图">
            <button class="minimap-object minimap-title" type="button" data-camera-target="overview" aria-label="查看项目概览"></button>
            <button class="minimap-object minimap-result" type="button" data-camera-target="generate" aria-label="查看生成结果"></button>
            <button class="minimap-object minimap-agent" type="button" data-camera-target="agent" aria-label="查看 Agent 写回"></button>
            <span class="minimap-viewport" data-minimap-viewport></span>
          </div>
        </div>

        <form
          class="generation-composer"
          data-generation-form
          data-status-generating="正在画布中生成…"
          data-status-generated="图片已生成"
        >
          <label class="sr-only" for="generation-prompt-zh">描述想生成的图片</label>
          <input id="generation-prompt-zh" data-prompt-input value="一盏带暖色接缝的连续铝合金桌面灯" autocomplete="off" />
          <button class="composer-icon" type="button" data-composer-settings aria-label="生成设置" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h5.25M13.75 7.5H19M12 5.75v3.5M5 16.5h8.25M16.75 16.5H19M15 14.75v3.5" /></svg>
          </button>
          <button class="generate-button" type="submit" data-generate-button>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.75 18.25 5.5a.7.7 0 0 1 .95.82l-3.85 12.9a.7.7 0 0 1-1.26.18l-3.05-4.65-4.98-1.72a.7.7 0 0 1-.06-1.28Z" /><path d="m11.05 14.7 3.7-3.7" /></svg>
            <span class="sr-only">生成</span>
          </button>
          <p class="sr-only" role="status" aria-live="polite" data-demo-status></p>
        </form>

        <div class="canvas-links" aria-label="项目链接">
          <a href="https://github.com/walnut-a/CoreStudio" target="_blank" rel="noreferrer">源代码</a>
          <a href="https://github.com/walnut-a/CoreStudio/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT</a>
        </div>
      </main>
    </div>
  </body>
</html>
